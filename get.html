<style>
  :root { --bg:#f6efe2; --ink:#3b2a14; --muted:#7a6a55; --brand:#6b4a1f; --accent:#e8ac3e; --card:#fffaf0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17120e; --ink:#f5eedf; --muted:#b0a490; --brand:#f5eedf; --accent:#e8ac3e; --card:#241b13; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Georgia,"Times New Roman",serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  img { width:120px; height:120px; display:block; margin:0 auto 20px; }
  h1 { font-size:44px; margin:0 0 10px; color:var(--brand); letter-spacing:-.5px; }
  p.tag { font-size:20px; line-height:1.4; margin:0 0 28px; text-wrap:balance; }
  a.btn { display:block; background:var(--accent); color:#1c140c; text-decoration:none; font:700 19px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
          padding:20px 16px; border-radius:999px; }
  a.btn:active { transform:scale(.98); }
  p.free { font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--muted); margin:14px 0 0; }
  .help { margin-top:30px; background:var(--card); border-radius:16px; padding:16px;
          font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--muted); }
  .help a { color:var(--ink); word-break:break-all; }
  .help button { margin-top:10px; font:600 14px/1 system-ui,sans-serif; padding:10px 16px; border-radius:999px;
                 border:1px solid var(--muted); background:transparent; color:var(--ink); }
</style>

    document.documentElement.lang = "en";
    document.getElementById("tag").innerHTML = "Read in the original.<br>Understand it all.";
    document.getElementById("btn").textContent = "Download on Google Play";
    document.getElementById("free").textContent = "Free. No subscription.";
    document.getElementById("help").textContent = "Button not opening the Play Store? Tap ⋮ at the top and choose “Open in browser”, or copy the link:";
    document.getElementById("copy").textContent = "Copy link";
  }
  // On Android, ask the system to open the Play Store app directly; fall back to the web page.
  if (/Android/i.test(navigator.userAgent)) {
    document.getElementById("btn").href =
      "intent://details?id=" + PKG + "#Intent;scheme=market;package=com.android.vending;" +
      "S.browser_fallback_url=" + encodeURIComponent(WEB) + ";end";
  }
  document.getElementById("copy").addEventListener("click", function () {
    var b = this, done = function () { b.textContent = it ? "Copiato ✓" : "Copied ✓"; };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(WEB).then(done, function () {}); }
    else { var t = document.createElement("textarea"); t.value = WEB; document.body.appendChild(t); t.select();
           try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(t); }
  });
})();
</script>
</body>
</html>
